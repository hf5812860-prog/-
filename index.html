<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>مفكك Luraph AI</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--line:#30363d;--fg:#c9d1d9;--dim:#8b949e;
--blue:#58a6ff;--green:#238636;--red:#f85149;--amber:#9e6a03}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#app{display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:14px;color:var(--blue)}
input,button,textarea{font:inherit;color:var(--fg)}
input{background:var(--bg);border:1px solid var(--line);border-radius:4px;
padding:6px 10px;outline:none}
input:focus{border-color:var(--blue)}
button{background:#21262d;border:1px solid var(--line);border-radius:4px;
padding:6px 14px;cursor:pointer}
button:hover{background:var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
button.pri{background:var(--green);border-color:var(--green);color:#fff}
button.pri:hover{background:#2ea043}
main{display:flex;flex:1;min-height:0}
aside{width:340px;border-left:1px solid var(--line);display:flex;
flex-direction:column;min-height:0}
.up{padding:12px;border-bottom:1px solid var(--line)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;
text-align:center;cursor:pointer;color:var(--dim);font-size:12px;
transition:.2s}
.drop:hover,.drop.over{border-color:var(--blue);color:var(--blue);background:#0a1929}
.list{flex:1;overflow-y:auto;padding:8px}
.empty{color:#484f58;font-size:12px;padding:12px;text-align:center}
.job{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;
border:1px solid transparent}
.job:hover{background:var(--bg2)}
.job.sel{background:#1f2937;border-color:var(--blue)}
.job .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .m{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:4px}
.b{padding:1px 6px;border-radius:3px;font-size:10px;text-transform:uppercase}
.b.queued{background:var(--line)}
.b.running{background:var(--amber);color:#fff}
.b.done{background:var(--green);color:#fff}
.b.failed{background:var(--red);color:#fff}
section.view{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2)}
.tab{padding:9px 16px;cursor:pointer;color:var(--dim);font-size:12px;
border-bottom:2px solid transparent}
.tab.on{color:var(--blue);border-color:var(--blue)}
.pane{flex:1;overflow:auto}
.center{flex:1;display:flex;align-items:center;justify-content:center;
color:#484f58;font-style:italic;font-size:14px}
.pw{padding:32px;max-width:600px}
.pw h2{color:var(--blue);margin:0 0 16px}
.bar{height:6px;background:#21262d;border-radius:3px;overflow:hidden;margin:16px 0 8px}
.bar>i{display:block;height:100%;background:var(--green);transition:width .3s}
.stage{color:var(--dim);font-size:12px}
.err{color:var(--red);margin-top:16px;white-space:pre-wrap;font-size:12px}
.code{display:flex;font-size:12px;line-height:1.5;margin:0}
.code .ln{color:#484f58;user-select:none;padding:12px;flex-shrink:0;
border-left:1px solid var(--line);background:#0a0d12;text-align:left}
.code .src{padding:12px;white-space:pre;flex:1;overflow-x:auto}
.stats{display:flex;gap:24px;padding:16px;background:var(--bg2);
border-bottom:1px solid var(--line);font-size:12px}
.stats b{color:var(--blue)}
.sec{padding:16px 24px;max-width:1000px}
.sec h3{font-size:12px;color:var(--blue);text-transform:uppercase;
margin:0 0 10px;letter-spacing:.5px}
.sec table{width:100%;font-size:12px;border-collapse:collapse}
.sec td{padding:5px 8px;border-bottom:1px solid #21262d;word-break:break-all}
.sec td:first-child{color:#79c0ff;width:40%}
.sec td:last-child{color:var(--dim)}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:10px;max-width:78%;white-space:pre-wrap;
font-size:13px;line-height:1.5}
.msg.user{align-self:flex-end;background:#1f6feb;color:#fff}
.msg.ai{align-self:flex-start;background:var(--bg2);border:1px solid var(--line)}
.msg.err{border-color:var(--red);color:var(--red)}
.hint{color:#484f58;font-style:italic;text-align:center;padding:32px;font-size:12px}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.cin input{flex:1}
.md{padding:24px 32px;max-width:900px;line-height:1.7}
.md h1{font-size:20px;color:var(--blue);margin:24px 0 12px;padding-bottom:8px;
border-bottom:1px solid var(--line)}
.md h2{font-size:16px;color:#79c0ff;margin:20px 0 10px}
.md h3{font-size:13px;color:#a371f7;margin:16px 0 8px;text-transform:uppercase}
.md code{background:var(--bg2);padding:2px 6px;border-radius:3px;color:#ffa657}
.md pre{background:var(--bg2);padding:14px;border-radius:8px;overflow-x:auto;
border:1px solid var(--line)}
.md pre code{background:none;padding:0;color:var(--fg)}
.md ul{padding-inline-start:24px}
.md li{margin:4px 0}
.toast{position:fixed;bottom:20px;left:20px;background:var(--bg2);
border:1px solid var(--line);border-radius:6px;padding:10px 16px;font-size:12px;
z-index:100}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.ok{border-color:var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API_BASE="";
const WS_BASE=location.protocol==="https:"?"wss://"+location.host:"ws://"+location.host;
const $=(t,p={},...k)=>{const e=document.createElement(t);
  for(const[a,b]of Object.entries(p)){if(a==="class")e.className=b;
    else if(a==="style"&&typeof b==="object")Object.assign(e.style,b);
    else if(a.startsWith("on"))e.addEventListener(a.slice(2).toLowerCase(),b);
    else if(a==="html")e.innerHTML=b;else e[a]=b}
  for(const x of k.flat()){if(x==null||x===false)continue;
    e.append(x.nodeType?x:document.createTextNode(String(x)))}return e};
const K=()=>localStorage.getItem("k")||"";
const setK=k=>localStorage.setItem("k",k);
async function api(p,i={}){const r=await fetch(API_BASE+p,{...i,
  headers:{"X-API-Key":K(),...(i.headers||{})}});
  if(!r.ok)throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0,200)}`);
  const ct=r.headers.get("content-type")||"";
  return ct.includes("json")?r.json():r.text()}
function toast(t,k="ok"){const e=$("div",{class:"toast "+k},t);
  document.body.append(e);setTimeout(()=>e.remove(),3000)}
const fmt={kb:n=>(n/1024).toFixed(1)+" KB",n:n=>n.toLocaleString("en"),
  ago:i=>{const d=(Date.now()-new Date(i).getTime())/1000;
    if(d<60)return Math.floor(d)+"ث";if(d<3600)return Math.floor(d/60)+"د";
    if(d<86400)return Math.floor(d/3600)+"س";return Math.floor(d/86400)+"ي"}};
function md(text){let h=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,_l,c)=>`<pre><code>${c}</code></pre>`);
  h=h.replace(/^# (.*)$/gm,"<h1>$1</h1>");
  h=h.replace(/^## (.*)$/gm,"<h2>$1</h2>");
  h=h.replace(/^### (.*)$/gm,"<h3>$1</h3>");
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  h=h.replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>");
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>");
  h=h.split(/\n\n+/).map(p=>/^<(h\d|pre|ul)/.test(p.trim())?p:
    `<p>${p.replace(/\n/g,"<br/>")}</p>`).join("\n");
  return h}
const S={jobs:[],selected:null,tab:"analysis",live:{},source:null,
  analysis:null,report:null,chat:[],chatBusy:false,upBusy:false};
let listeners=[],ws=null;
const render=()=>listeners.forEach(f=>f());
const onR=f=>{listeners.push(f);return()=>listeners=listeners.filter(x=>x!==f)};
async function refresh(){try{S.jobs=await api("/api/jobs");render()}catch{}}
function subscribe(id){if(ws){try{ws.close()}catch{}ws=null}
  try{ws=new WebSocket(`${WS_BASE}/ws/jobs/${id}`);
    ws.onmessage=e=>{try{const m=JSON.parse(e.data);
      S.live={...S.live,...m};render();
      if(m.status==="done"||m.status==="failed"){refresh();
        try{ws.close()}catch{}}}catch{}};
    ws.onerror=()=>{}}catch{}}
setInterval(()=>{if(!S.selected)return;const j=S.jobs.find(x=>x.id===S.selected);
  if(j&&(j.status==="queued"||j.status==="running"))refresh()},4000);
setInterval(refresh,8000);

const API={list:()=>api("/api/jobs"),get:id=>api("/api/jobs/"+id),
  source:async id=>{const r=await fetch(`${API_BASE}/api/jobs/${id}/source`,
    {headers:{"X-API-Key":K()}});if(!r.ok)throw new Error(r.status);return r.text()},
  report:async id=>{const r=await fetch(`${API_BASE}/api/jobs/${id}/report`,
    {headers:{"X-API-Key":K()}});if(!r.ok)throw new Error(r.status);return r.text()},
  analysis:id=>api(`/api/jobs/${id}/analysis`),
  chat:(id,q)=>api(`/api/jobs/${id}/chat`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({q})}).then(r=>r.answer),
  dl:id=>`${API_BASE}/api/jobs/${id}/source/download?k=${encodeURIComponent(K())}`,
  upload:(file,cb)=>new Promise((res,rej)=>{const x=new XMLHttpRequest();
    x.open("POST",API_BASE+"/api/upload");x.setRequestHeader("X-API-Key",K());
    x.upload.onprogress=e=>cb&&cb(e.loaded/e.total);
    x.onload=()=>x.status>=200&&x.status<300?res(JSON.parse(x.responseText)):
      rej(new Error("HTTP "+x.status+": "+x.responseText.slice(0,200)));
    x.onerror=()=>rej(new Error("network"));const fd=new FormData();
    fd.append("file",file);x.send(fd)})};

async function selectJob(id){S.selected=id;S.tab="analysis";S.live={};
  S.source=S.analysis=S.report=null;S.chat=[];render();
  const j=S.jobs.find(x=>x.id===id);if(!j)return;
  if(j.status!=="done"){subscribe(id);return}
  try{S.analysis=await API.analysis(id)}catch(e){S.analysis="error: "+e.message}render();
  try{S.source=await API.source(id)}catch(e){S.source="error: "+e.message}render();
  try{S.report=await API.report(id)}catch(e){S.report="error: "+e.message}render()}

const Header=()=>{const i=$("input",{placeholder:"API key",value:K()});
  return $("header",{},$("h1",{},"مفكك Luraph AI"),
    $("div",{style:{display:"flex",gap:6}},i,
      $("button",{onClick:()=>{setK(i.value);toast("تم الحفظ");refresh()}},"حفظ")))};

const Upload=()=>{const fi=$("input",{type:"file",accept:".lua,.luau,.txt",
  style:{display:"none"},onChange:e=>{const f=e.target.files?.[0];if(f)up(f)}});
  const z=$("div",{class:"drop",onClick:()=>fi.click()},
    S.upBusy?"جاري الرفع...":"اسحب ملف .lua هنا أو اضغط");
  z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over")});
  z.addEventListener("dragleave",()=>z.classList.remove("over"));
  z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("over");
    const f=e.dataTransfer.files[0];if(f)up(f)});
  async function up(f){S.upBusy=true;render();
    try{const r=await API.upload(f);S.selected=r.id;S.tab="analysis";
      S.live={};S.source=S.analysis=S.report=null;S.chat=[];
      subscribe(r.id);refresh();toast("بدأ التحليل")}
    catch(e){toast("فشل: "+e.message,"err")}finally{S.upBusy=false;render()}}
  return $("div",{class:"up"},fi,z)};

const Row=j=>$("div",{class:"job"+(j.id===S.selected?" sel":""),
  onClick:()=>selectJob(j.id)},
  $("div",{class:"n",title:j.input_name},j.input_name),
  $("div",{class:"m"},
    $("span",{class:"b "+j.status},j.status),
    $("span",{},j.stage||""),
    $("span",{},j.progress+"%"),
    $("span",{},fmt.ago(j.created_at))));

const Aside=()=>$("aside",{},Upload(),
  $("div",{class:"list"},S.jobs.length===0?$("div",{class:"empty"},"لا يوجد"):
    S.jobs.map(Row)));

const Progress=j=>{const m={...j,...S.live};
  return $("div",{class:"pw"},
    $("h2",{},m.status==="failed"?"فشل":"جاري المعالجة..."),
    $("div",{class:"bar"},$("i",{style:{width:(m.progress||0)+"%"}})),
    $("div",{class:"stage"},`${m.stage||"..."} — ${m.progress||0}%`),
    m.error?$("pre",{class:"err"},m.error):null)};

const CodeV=()=>{if(S.source===null)return $("div",{class:"center"},"جاري التحميل...");
  if(typeof S.source==="string"&&S.source.startsWith("error:"))
    return $("div",{class:"err",style:{padding:"16px"}},S.source);
  const lines=S.source.split("\n");
  return $("div",{class:"code"},
    $("div",{class:"ln"},lines.map((_,i)=>i+1).join("\n")),
    $("div",{class:"src"},S.source))};

const AnalysisV=()=>{if(S.analysis===null)return $("div",{class:"center"},"جاري التحميل...");
  if(typeof S.analysis==="string")
    return $("div",{class:"err",style:{padding:16}},S.analysis);
  const a=S.analysis;
  const sec=(t,items,color)=>{if(!items||items.length===0)return null;
    return $("div",{class:"sec"},
      $("h3",{style:color?{color}:{}},`${t} (${items.length})`),
      $("table",{},$("tbody",{},items.slice(0,300).map(x=>
        $("tr",{},$("td",{},typeof x==="string"?x:(x.name||JSON.stringify(x))),
          $("td",{},typeof x==="object"?(x.value||x.why||""):""))))))};
  return $("div",{},
    $("div",{class:"stats"},
      $("div",{},$("b",{},fmt.kb(a.size_bytes))," حجم"),
      $("div",{},$("b",{},fmt.n(a.lines))," سطر"),
      $("div",{},$("b",{style:{color:a.flag_count>0?"var(--red)":"var(--green)"}},
        a.flag_count)," علامة"),
      $("div",{},$("b",{},(a.urls||[]).length)," رابط"),
      $("div",{},$("b",{},(a.ips||[]).length)," IP"),
      $("div",{},$("b",{},(a.webhooks||[]).length)," Webhook")),
    sec("رموز مشبوهة",a.flags,"var(--red)"),
    sec("روابط",a.urls),sec("Webhooks",a.webhooks,"var(--red)"),
    sec("نطاقات",a.domains),sec("IPs",a.ips),
    sec("أسرار",a.secrets,"#f0883e"))};

const ReportV=()=>{if(S.report===null)return $("div",{class:"center"},"جاري التحميل...");
  if(typeof S.report==="string"&&S.report.startsWith("error:"))
    return $("div",{class:"err",style:{padding:16}},S.report);
  return $("div",{class:"md",html:md(S.report)})};

const ChatV=()=>{const msgs=$("div",{class:"msgs"},
    S.chat.length===0&&!S.chatBusy?$("div",{class:"hint"},
      "اسأل أي شي عن السكربت"):null,
    ...S.chat.map(m=>$("div",{class:"msg "+m.role+(m.err?" err":"")},m.text)),
    S.chatBusy?$("div",{class:"msg ai"},"يكتب..."):null);
  const i=$("input",{placeholder:"اكتب سؤالك..."});
  const send=async()=>{const q=i.value.trim();if(!q||S.chatBusy)return;
    i.value="";S.chat.push({role:"user",text:q});S.chatBusy=true;render();
    try{S.chat.push({role:"ai",text:await API.chat(S.selected,q)})}
    catch(e){S.chat.push({role:"ai",text:"خطأ: "+e.message,err:true})}
    finally{S.chatBusy=false;render()}};
  i.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
  return $("div",{class:"chat"},msgs,
    $("div",{class:"cin"},i,
      $("button",{class:"pri",onClick:send,disabled:S.chatBusy},"إرسال")))};

const JobView=j=>{const m={...j,...S.live};
  if(m.status!=="done")return Progress(m);
  const tabs=["analysis","source","report","chat"];
  const L={analysis:"تحليل",source:"الكود",report:"تقرير AI",chat:"محادثة"};
  return $("section",{class:"view"},
    $("div",{class:"tabs"},...tabs.map(t=>
      $("div",{class:"tab"+(S.tab===t?" on":""),onClick:()=>{S.tab=t;render()}},L[t])),
      $("div",{style:{flex:1}}),
      $("a",{href:API.dl(j.id),class:"tab",download:true},"⬇ تحميل")),
    $("div",{class:"pane"},
      S.tab==="analysis"?AnalysisV():S.tab==="source"?CodeV():
      S.tab==="report"?ReportV():S.tab==="chat"?ChatV():null))};

function App(){const root=document.getElementById("app");
  const j=S.jobs.find(x=>x.id===S.selected)||null;
  root.innerHTML="";
  root.append(Header(),
    $("main",{},j?JobView(j):$("section",{class:"view"},
      $("div",{class:"center"},"ارفع ملف لكي يبدأ التحليل")),Aside()))}
onR(App);App();refresh();
</script>
</body>
</html>
