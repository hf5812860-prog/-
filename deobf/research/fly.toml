app = "asdad3242"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DEOBF_ROOT = "/app/deobf"
  STORAGE_DIR = "/app/storage"
  API_KEYS = "admin"
  AI_PROVIDER = "anthropic"
  AI_MODEL = "claude-sonnet-4-5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
